# Flujo de trabajo para desplegar el proyecto "Taxis NYC Big Data" en GitHub Pages
name: Deploy Portafolio Taxis NYC to Pages

on:
  # El despliegue se ejecutará automáticamente cada vez que subas cambios (push) a la rama "main".
  # Así, si luego agregas más fotos a tu carpeta "evidencias", la web se actualizará sola.
  push:
    branches: ["main"]

  # Te permite ejecutar este flujo de trabajo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

# Configura los permisos del GITHUB_TOKEN para permitir el despliegue en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue a la vez. Si haces varios cambios rápidos, los pone en fila.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Trabajo único de despliegue
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Descargar el código de tu repositorio)
        uses: actions/checkout@v4
        
      - name: Setup Pages (Configurar el entorno de GitHub Pages)
        uses: actions/configure-pages@v5
        
      - name: Upload artifact (Subir los archivos de tu evaluación)
        uses: actions/upload-pages-artifact@v3
        with:
          # El path '.' significa que subirá todo tu repositorio (el README.md, las evidencias y los docs)
          path: '.'
          
      - name: Deploy to GitHub Pages (Publicar la página web)
        id: deployment
        uses: actions/deploy-pages@v5
